<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specificity</title>
    <style>
        @layer special,base;
        /* @layer try,base; */
        @layer base{
            body{
                background-color: white;
            }
            p{
                font-size: 30px;
                color: blueviolet;
            }
            button{
                font-size: 20px;
                border-radius: 50%;
                width: 150px;
                height: 150px;
                background-color: white;
                border: 1px solid grey;
                box-shadow: 3px 3px 5px grey;
            }
            button:active{
                box-shadow: inset 3px 3px 5px grey;
            }
        }
        @layer special{
            body{
                background-color: black;
            }
            p{
            color:blue;
            }
            button{
                border: 1px solid white;
                box-shadow:inset 3px 3px 5px white;
            }
            button:active{
                box-shadow:inset 3px 3px 3px grey;
            }
        }
        .card{
            width: 300px;
            padding: 3%;
            box-shadow: 3px 3px 5px grey;
            margin: auto;
        }
        .card_text{
            font-family: Arial;
            font-weight: 900;
        }
        .card_button_submit{
            background-color: black;
            color: white;
            box-shadow: 3px 3px 5px grey;
            width: 100px;
            height: 40px;
        }
        .card_img{
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <p>Specificity : we create layers</p>
    <button>Click Me!!!</button>
    <div class="card">
        <img class="card_img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR2cX_lU_2_fxWFlPYOZxJXwphnsm_qccyPuYyrsomFiV16U_ehxdtL3M0z&s=10"/>
        <p class="class_text">lorem gibsum</p>
        <button class="card_button_submit">SUBMIT</button>
    </div>
</body>
</html>
