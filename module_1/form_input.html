<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input{
            border-width: 0px 0px 3px 0px;
            border-color:black;
            display: block;
            margin-top: 3%;
            font-size: 25px;

        }
        input:required{
            border-color: red;
        }
        input:optional{
            border-color:green;
        }
        input:enabled{
            background-color: transparent;
            box-shadow: 0 0 3px black;
        }
        input:disabled{
            background-color: grey;
            border-width: 0px;
        }
        input:valid{
            background-color: green;

        }
        input:invalid{
            border-color: red;
            border-width: 3px 3px 3px 3px;            
        }
        input:in-range{
            background-color: aqua;
        }
        input:out-of-range{
            border-width: 3px 3px 3px 3px red;
            background-color: red;          
        }
        input:read-only{
            border-width: 0px;
            box-shadow: 0 0 0 0 transparent;
            background-color: grey;
            color:white
        }
        input:focus{
            box-shadow: 0 0 15px black;
        }
    </style>
</head>
<body>
    <input type="text" placeholder="first name" required>
    <input type="text" placeholder="middle" optional>
    <input type="text" placeholder="lastt name" required>
    <input type="text" placeholder="address" disabled value="Mathura">
    <input type="email" placeholder="E-mail">
    <input type="number" placeholder="0" min="1" max="10" >
    <input type="text" value="Mr." readonly>

    
        
        
</body>
</html>
