<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>

    <style>

        .gallery {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 10px;
            width: 800px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background-color: black;
        }

    </style>
</head>

<body>

    <h1>Photo Gallery</h1>

    <div class="gallery">

        <img src="image1.jpg">
        <img src="image2.jpg">
        <img src="image3.jpg">
        <img src="image4.jpg">

        <img src="image5.jpg">
        <img src="image6.jpg">
        <img src="image7.jpg">
        <img src="image8.jpg">

        <img src="image9.jpg">
        <img src="image10.jpg">
        <img src="image11.jpg">
        <img src="image12.jpg">

        <img src="image13.jpg">
        <img src="image14.jpg">
        <img src="image15.jpg">
        <img src="image16.jpg">

    </div>

</body>
</html>
