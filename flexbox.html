<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            flex-direction:row;
            outline:3px solid black;
            display:flex;
            justify-content:center;
            align-items:center;

        }
        .container>div{
            color:white;
            height:100px;
        }
        .box1{
            background-color:orange;
            flex-basis:100%;
        }
         .box2{
            background-color:white;
            flex-basis:100px;   
        } .box3{
            background-color:blue;
            flex-basis:100%;   
        }
        .box4{
            background-color:white;
            flex-basis:100px;   
        }
        .box5{
            background-color:green;
            flex-basis:100%;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
        <div class="box5"></div>
    </div>
    
</body>
</html>
