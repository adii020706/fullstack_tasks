<!DOCTYPE html>
<html>
<head>
    <title>Newspaper</title>

    <style>

        body {
            background: black;
        }

        .page {
            width: 700px;
            margin: auto;
            padding: 15px;
            background: white;
            outline: 2px solid black;
        }

        .header {
            text-align: center;
            font-size: 60px;
            outline: 2px solid black;
        }

        .top {
            outline: 2px solid black;
            padding: 5px;
            overflow: hidden;
        }

        .top div {
            float: left;
            width: 25%;
            text-align: center;
        }

        .main {
            outline: 2px solid black;
            overflow: hidden;
        }

        .box1 {
            float: left;
            width: 20%;
            padding: 10px;
            outline: 2px solid black;
            box-sizing: border-box;
            
        }

        .box2 {
            float: left;
            width: 55%;
            padding: 10px;
            outline: 2px solid black;
            box-sizing: border-box;
        }

        .box3 {
            float: left;
            width: 25%;
            padding: 10px;
            outline: 2px solid black;
            box-sizing: border-box;
        }

        .box2 img {
            width: 100%;
            height: 250px;
        }

        .box3 img {
            width: 100%;
            height: 100px;
        }

        .bottom {
            outline: 2px solid black;
            overflow: hidden;
        }

        .box4 {
            float: left;
            width: 33.33%;
            padding: 10px;
            box-sizing: border-box;
        }

        .box5 {
            float: left;
            width: 33.33%;
            padding: 10px;
            box-sizing: border-box;
        }

        .box6 {
            float: left;
            width: 33.33%;
            padding: 10px;
            box-sizing: border-box;
        }

        .box4 img {
            width: 100%;
            height: 100px;
        }

        .ad {
            clear: both;
            outline: 2px solid black;
            margin-top: 15px;
            padding: 15px;
            text-align: center;
        }

    </style>
</head>

<body>

    <div class="page">

        <div class="header">
            NEWSPAPER
        </div>

        <div class="top">
            <div>cont1</div>
            <div>cont2</div>
            <div>cont3</div>
            <div>cont4</div>
        </div>

        <h2>cont5</h2>

        <div class="main">

            <div class="box1">
                <h3>box1</h3>
                <p>cont6</p>
                <p>cont7</p>
            </div>

            <div class="box2">
                <img src="image.jpg">
                <p>cont8</p>
            </div>

            <div class="box3">
                <h3>box3</h3>
                <p>cont9</p>
                <img src="image.jpg">
            </div>

        </div>

        <div class="bottom">

            <div class="box4">
                <img src="image.jpg">
                <p>cont10</p>
            </div>

            <div class="box5">
                <p>cont11</p>
                <p>cont12</p>
            </div>

            <div class="box6">
                <p>cont13</p>
                <p>cont14</p>
            </div>

        </div>

        <div class="ad">
            <h2>ADVERTISEMENT</h2>
        </div>

    </div>

</body>
</html>
