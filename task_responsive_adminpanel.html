<!DOCTYPE html>
<html>
<head>
    <title>Responsive Dashboard</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 150px 1fr 1fr 1fr;
            gap: 10px;
            padding: 10px;
        }

        .header {
            grid-column: 1 / 5;
            background-color: lightblue;
            padding: 20px;
            text-align: center;
        }

        .sidebar {
            grid-row: 2 / 5;
            background-color: lightgreen;
            padding: 80px 10px;
            text-align: center;
        }

        .stat {
            background-color: lightyellow;
            padding: 30px;
            text-align: center;
        }

        .recent {
            background-color: pink;
            padding: 40px;
            text-align: center;
        }

        .activity {
            background-color: pink;
            padding: 40px;
            text-align: center;
        }

        .footer {
            grid-column: 1 / 5;
            background-color: lightblue;
            padding: 20px;
            text-align: center;
        }


        /* TABLET */

        @media (max-width: 800px) {

            .dashboard {
                grid-template-columns: 150px 1fr 1fr;
            }

            .header {
                grid-column: 1 / 4;
            }

            .sidebar {
                grid-row: 2 / 5;
            }

            .footer {
                grid-column: 1 / 4;
            }

        }


        /* MOBILE */

        @media (max-width: 500px) {

            .dashboard {
                display: block;
            }

            .header,
            .sidebar,
            .stat,
            .recent,
            .activity,
            .footer {
                margin-bottom: 10px;
            }

            .sidebar {
                padding: 20px;
            }

            .stat {
                padding: 20px;
            }

        }

    </style>
</head>

<body>

    <div class="dashboard">

        <div class="header">
            HEADER
        </div>

        <div class="sidebar">
            SIDEBAR
        </div>

        <div class="stat">
            STAT
        </div>

        <div class="stat">
            STAT
        </div>

        <div class="stat">
            STAT
        </div>

        <div class="stat">
            STAT
        </div>

        <div class="stat">
            STAT
        </div>

        <div class="stat">
            STAT
        </div>

        <div class="recent">
            RECENT ORDERS
        </div>

        <div class="activity">
            ACTIVITY
        </div>

        <div class="footer">
            FOOTER
        </div>

    </div>

</body>
</html>
